apiVersion: v1
kind: ResourceQuota
metadata:
  name: azuredocs-resource-quota
  namespace: azuredocs-app
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    requests.storage: 200Gi
    persistentvolumeclaims: "20"
    pods: "100"
    services: "30"
    secrets: "100"
    configmaps: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: azuredocs-resource-limits
  namespace: azuredocs-app
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "8"
        memory: 16Gi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi

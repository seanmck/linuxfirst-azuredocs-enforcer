apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: linuxfirst-docs
  namespace: argocd
spec:
  description: Linux First Azure Docs Enforcer
  sourceRepos:
    - 'https://github.com/seanmck/linuxfirst-azuredocs-enforcer.git'
  destinations:
    - namespace: azuredocs-prod
      server: https://kubernetes.default.svc
    - namespace: azuredocs-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  # Namespace-scoped resources (only what we deploy)
  namespaceResourceWhitelist:
    # Core resources
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    # Workloads
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    # Networking
    - group: networking.k8s.io
      kind: Ingress
    # KEDA autoscaling
    - group: keda.sh
      kind: ScaledObject
    - group: keda.sh
      kind: TriggerAuthentication
    # Azure Key Vault CSI
    - group: secrets-store.csi.x-k8s.io
      kind: SecretProviderClass

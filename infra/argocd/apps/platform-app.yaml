apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linuxfirst-docs-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: linuxfirst-docs-platform
  source:
    repoURL: https://github.com/seanmck/linuxfirst-azuredocs-enforcer.git
    targetRevision: main
    path: infra/k8s/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
